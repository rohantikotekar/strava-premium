[project]
name = "sp-worker"
version = "0.1.0"
description = "Celery workers. All heavy work lives here (CLAUDE.md §4.1)."
requires-python = ">=3.12"
dependencies = [
    "sp-core",
    "sp-db",
    "celery[redis]>=5.4",
    "redis>=5.2",
]

[tool.uv.sources]
sp-core = { workspace = true }
sp-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sp_worker"]
