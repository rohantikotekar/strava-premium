# Local development infrastructure.
#
# By default this starts ONLY the backing services (postgres, redis, minio) and you
# run the API, worker, and web app on the host — fastest iteration, and it sidesteps
# Windows bind-mount and presigned-URL-endpoint pain entirely.
#
#   docker compose up -d
#
# To run the application services in Docker too (closer to the cloud topology we
# deploy in v2):
#
#   docker compose --profile full up -d --build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sp
      POSTGRES_PASSWORD: sp_dev_password
      POSTGRES_DB: strava_premium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the non-superuser `sp_app` role the app connects as. Without it
      # RLS is silently bypassed — see the file's own comment.
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sp -d strava_premium"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket and allows browser PUTs (presigned uploads are cross-origin
  # from the Vite dev server, so CORS has to be open on the bucket).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/strava-premium &&
      mc anonymous set none local/strava-premium &&
      echo 'bucket ready'
      "

  # ---- application services (profile: full) --------------------------------
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    # Values fall back to the local-dev defaults when no repo-root .env
    # overrides them, so `docker compose --profile full up` behaves exactly
    # as before for local testing. A production .env (see DEPLOYMENT.md)
    # overrides every one of these — without this interpolation, a real
    # deploy would silently keep talking to local MinIO on a dev secret.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sp_app:sp_dev_password@postgres:5432/strava_premium}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-strava-premium}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-not-a-real-secret-change-me}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev-only-fernet-key-generated-on-boot}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    # WORKER_CONCURRENCY lets a low-RAM deploy (e.g. a 1GB EC2 free-tier
    # instance) drop to 1 so two parser processes never hold ingest buffers
    # in memory at once — see DEPLOYMENT.md's AWS EC2 sizing note.
    command: celery -A sp_worker.celery_app worker --loglevel=info -Q ingest --concurrency=${WORKER_CONCURRENCY:-2}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sp_app:sp_dev_password@postgres:5432/strava_premium}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-strava-premium}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
